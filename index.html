<!DOCTYPE html>

<html lang="sr">
<head>

  <meta charset="UTF-8">

<meta name="viewport"
     content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <meta name="theme-color" content="#111827">

  <title>Putni nalog</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin: 5px 0 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 13px;
      background: white;
    }

    input:focus {
      outline: none;
      border-color: #111827;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .save {
      background: #111827;
      color: white;
      margin-top: 5px;
    }

    .save:disabled {
      opacity: .6;
    }

    .install {
      background: #2563eb;
      color: white;
      margin-bottom: 15px;
      display: none;
    }

    .total-box {
      background: #111827;
      color: white;
      border-radius: 12px;
      padding: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total-label {
      font-size: 15px;
    }

    .total-value {
      font-size: 25px;
      font-weight: bold;
    }

    .trip {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .trip-route {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .trip-info {
      font-size: 14px;
      color: #4b5563;
      line-height: 1.6;
    }

    .trip-distance {
      font-size: 16px;
      font-weight: bold;
      margin-top: 5px;
    }

    .delete {
      margin-top: 10px;
      padding: 9px;
      font-size: 14px;
      background: #fee2e2;
      color: #991b1b;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 15px 5px;
    }

    .loading {
      color: #6b7280;
      text-align: center;
      padding: 10px;
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-size: 14px;
      text-align: center;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

  </style>

</head>

<body>

  <div id="status" class="status"></div>

<script>


/* =========================================================
   API
   ========================================================= */

const API_URL =
'https://script.google.com/macros/s/AKfycbxP2DMW9ijdOXOxorNIvUwq4GImQ5YpHCgiJ7oAMs3eXyvVJ9eE7st76Ihc33RMqCzU/exec';


/* =========================================================
   ELEMENTI
   ========================================================= */

const dateInput =
  document.getElementById('date');

const departureTimeInput =
  document.getElementById('departureTime');

const arrivalTimeInput =
  document.getElementById('arrivalTime');

const vehicleInput =
  document.getElementById('vehicle');

const startPlaceInput =
  document.getElementById('startPlace');

const endPlaceInput =
  document.getElementById('endPlace');

const startKmInput =
  document.getElementById('startKm');

const endKmInput =
  document.getElementById('endKm');

const saveButton =
  document.getElementById('saveButton');

const dailyTotal =
  document.getElementById('dailyTotal');

const tripsContainer =
  document.getElementById('tripsContainer');

const distancePreview =
  document.getElementById('distancePreview');

const statusBox =
  document.getElementById('status');


/* =========================================================
   POMOĆNE FUNKCIJE
   ========================================================= */

function todayISO() {

  const now = new Date();

  return (
    now.getFullYear() +
    '-' +
    String(now.getMonth() + 1).padStart(2, '0') +
    '-' +
    String(now.getDate()).padStart(2, '0')
  );

}


function formatDateForAPI(value) {

  const parts = value.split('-');

  return (
    parts[2] +
    '-' +
    parts[1] +
    '-' +
    parts[0]
  );

}


function formatNumber(value) {

  const n =
    Number(
      String(value).replace(',', '.')
    );

  return isNaN(n) ? 0 : n;

}


function formatKm(value) {

  const n = formatNumber(value);

  return Number.isInteger(n)
    ? String(n)
    : n.toFixed(1);

}


function showStatus(message, type) {

  statusBox.textContent = message;

  statusBox.className =
    'status ' + type;

  setTimeout(function() {

    statusBox.className =
      'status';

  }, 4000);

}


function calculateDistance() {

  if (
    startKmInput.value === '' ||
    endKmInput.value === ''
  ) {

    distancePreview.textContent =
      'Pređeno: 0 km';

    return;

  }

  const distance =
    formatNumber(endKmInput.value) -
    formatNumber(startKmInput.value);


  if (distance < 0) {

    distancePreview.textContent =
      'Pređeno: neispravna kilometraža';

    return;

  }


  distancePreview.textContent =
    'Pređeno: ' +
    formatKm(distance) +
    ' km';

}


function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================================================
   JSONP
   ========================================================= */

function jsonp(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      'callback_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 100000);


    const script =
      document.createElement('script');


    const query =
      new URLSearchParams(params);


    query.set(
      'callback',
      callbackName
    );


    query.set(
      '_',
      Date.now()
    );


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            'API odgovor nije stigao.'
          )
        );

      }, 15000);


    window[callbackName] =
      function(data) {

        clearTimeout(timeout);

        cleanup();

        resolve(data);

      };


    function cleanup() {

      try {

        delete window[callbackName];

      } catch (e) {

        window[callbackName] =
          undefined;

      }


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

    }


    script.onerror =
      function() {

        clearTimeout(timeout);

        cleanup();

        reject(
          new Error(
            'Greška pri povezivanju sa serverom.'
          )
        );

      };


    script.src =
      API_URL +
      '?' +
      query.toString();


    document.body.appendChild(
      script
    );

  });

}


/* =========================================================
   POSLEDNJI KM
   ========================================================= */

async function loadLastKm() {

  const date =
    formatDateForAPI(
      dateInput.value
    );


  try {

    const result =
      await jsonp({

        api:
          'getLastKmForDate',

        date:
          date

      });


    console.log(
      'LAST KM:',
      result
    );


    if (
      result !== '' &&
      result !== null &&
      result !== undefined
    ) {

      startKmInput.value =
        formatKm(result);

      calculateDistance();

    }

  }

  catch (error) {

    console.error(
      'Last km error:',
      error
    );

  }

}


/* =========================================================
   DNEVNI ZBIR
   ========================================================= */

async function loadDailyTotal() {

  const date =
    formatDateForAPI(
      dateInput.value
    );


  dailyTotal.textContent =
    '...';


  try {

    const result =
      await jsonp({

        api:
          'getDailyTotal',

        date:
          date

      });


    console.log(
      'DAILY TOTAL:',
      result
    );


    dailyTotal.textContent =
      formatKm(result) +
      ' km';

  }

  catch (error) {

    console.error(
      'Daily total error:',
      error
    );

    dailyTotal.textContent =
      'Greška';

  }

}


/* =========================================================
   UČITAVANJE VOŽNJI
   ========================================================= */

async function loadTrips() {

  const date =
    formatDateForAPI(
      dateInput.value
    );


  tripsContainer.innerHTML =
    '<div class="loading">Učitavanje...</div>';


  try {

    const result =
      await jsonp({

        api:
          'getTripsForDate',

        date:
          date

      });


    console.log(
      'TRIPS:',
      result
    );


    if (!Array.isArray(result)) {

      throw new Error(
        'API nije vratio niz putnih naloga.'
      );

    }


    renderTrips(result);

  }

  catch (error) {

    console.error(
      'Greška pri učitavanju putnih naloga:',
      error
    );


    tripsContainer.innerHTML =
      '<div class="empty">Nije moguće učitati putne naloge.</div>';

  }

}


/* =========================================================
   PRIKAZ VOŽNJI
   ========================================================= */

function renderTrips(trips) {

  if (
    !trips ||
    trips.length === 0
  ) {

    tripsContainer.innerHTML =
      '<div class="empty">Nema putnih naloga za izabrani datum.</div>';

    return;

  }


  tripsContainer.innerHTML =
    trips.map(function(trip) {

      return `

        <div class="trip">

          <div class="trip-route">

            ${escapeHtml(trip.from)}
            →
            ${escapeHtml(trip.to)}

          </div>


          <div class="trip-info">

            <div>
              Vreme:
              ${escapeHtml(trip.departureTime)}
              –
              ${escapeHtml(trip.arrivalTime)}
            </div>

            <div>
              Vozilo:
              ${escapeHtml(trip.vehicle)}
            </div>

            <div>
              Kilometraža:
              ${formatKm(trip.startKm)}
              km →
              ${formatKm(trip.endKm)}
              km
            </div>

          </div>


          <div class="trip-distance">

            Pređeno:
            ${formatKm(trip.distance)}
            km

          </div>


          <button
            class="delete"
            onclick="deleteTrip(${trip.row})"
          >

            Obriši

          </button>

        </div>

      `;

    }).join('');

}


/* =========================================================
   BRISANJE
   ========================================================= */

async function deleteTrip(row) {

  if (
    !confirm(
      'Da li sigurno želiš da obrišeš ovaj putni nalog?'
    )
  ) {

    return;

  }


  try {

    const result =
      await jsonp({

        api:
          'deleteTrip',

        row:
          row

      });


    if (
      result &&
      result.success === false
    ) {

      throw new Error(
        result.error ||
        'Brisanje nije uspelo.'
      );

    }


    showStatus(
      'Putni nalog je obrisan.',
      'success'
    );


    await refreshAll();

  }

  catch (error) {

    showStatus(
      'Greška: ' +
      error.message,
      'error'
    );

  }

}


/* =========================================================
   ČUVANJE
   ========================================================= */

async function saveTrip() {

  const date =
    formatDateForAPI(
      dateInput.value
    );


  const departureTime =
    departureTimeInput.value;

  const arrivalTime =
    arrivalTimeInput.value;

  const vehicle =
    vehicleInput.value.trim();

  const from =
    startPlaceInput.value.trim();

  const to =
    endPlaceInput.value.trim();

  const startKm =
    startKmInput.value;

  const endKm =
    endKmInput.value;


  if (
    !date ||
    !departureTime ||
    !arrivalTime ||
    !vehicle ||
    !from ||
    !to ||
    startKm === '' ||
    endKm === ''
  ) {

    showStatus(
      'Popunite sva polja.',
      'error'
    );

    return;

  }


  const start =
    formatNumber(startKm);

  const end =
    formatNumber(endKm);


  if (end < start) {

    showStatus(
      'Km dolaska ne može biti manji od km polaska.',
      'error'
    );

    return;

  }


  const data = {

    date:
      date,

    departureTime:
      departureTime,

    arrivalTime:
      arrivalTime,

    vehicle:
      vehicle,

    from:
      from,

    to:
      to,

    startKm:
      start,

    endKm:
      end

  };


  saveButton.disabled =
    true;

  saveButton.textContent =
    'Čuvanje...';


  try {

    const response =
      await fetch(

        API_URL,

        {

          method:
            'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              action:
                'saveTrip',

              data:
                data

            })

        }

      );


    const result =
      await response.json();


    console.log(
      'SAVE:',
      result
    );


    if (
      result &&
      result.success === false
    ) {

      throw new Error(
        result.error ||
        'Čuvanje nije uspelo.'
      );

    }


    showStatus(
      'Putni nalog je uspešno sačuvan.',
      'success'
    );


    startPlaceInput.value =
      '';

    endPlaceInput.value =
      '';

    arrivalTimeInput.value =
      '';

    endKmInput.value =
      '';


    await refreshAll();

  }

  catch (error) {

    console.error(
      'Save error:',
      error
    );


    showStatus(
      'Greška pri čuvanju: ' +
      error.message,
      'error'
    );

  }

  finally {

    saveButton.disabled =
      false;

    saveButton.textContent =
      'Sačuvaj putni nalog';

  }

}


/* =========================================================
   OSVEŽAVANJE
   ========================================================= */

async function refreshAll() {

  await Promise.all([

    loadLastKm(),

    loadDailyTotal(),

    loadTrips()

  ]);

}


/* =========================================================
   PROMENA DATUMA
   ========================================================= */

dateInput.addEventListener(
  'change',
  refreshAll
);


/* =========================================================
   KM
   ========================================================= */

startKmInput.addEventListener(
  'input',
  calculateDistance
);

endKmInput.addEventListener(
  'input',
  calculateDistance
);


/* =========================================================
   SAVE
   ========================================================= */

saveButton.addEventListener(
  'click',
  saveTrip
);


/* =========================================================
   PWA INSTALL
   ========================================================= */

let installPrompt = null;


window.addEventListener(
  'beforeinstallprompt',
  function(event) {

    event.preventDefault();

    installPrompt =
      event;

    document
      .getElementById('installButton')
      .style.display =
      'block';

  }
);


document
  .getElementById('installButton')
  .addEventListener(
    'click',
    async function() {

      if (!installPrompt) {
        return;
      }

      installPrompt.prompt();

      await installPrompt.userChoice;

      installPrompt =
        null;

      this.style.display =
        'none';

    }
  );


/* =========================================================
   SERVICE WORKER
   ========================================================= */

if (
  'serviceWorker' in navigator
) {

  window.addEventListener(
    'load',
    function() {

      navigator.serviceWorker
        .register(
          './service-worker.js'
        )

        .catch(
          console.error
        );

    }
  );

}


/* =========================================================
   START
   ========================================================= */

function initialize() {

  const now =
    new Date();


  dateInput.value =
    todayISO();


  departureTimeInput.value =
    String(
      now.getHours()
    ).padStart(2, '0') +
    ':' +
    String(
      now.getMinutes()
    ).padStart(2, '0');


  refreshAll();

}


initialize();

</script>
